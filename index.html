<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#005c8d" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json" />
    <title>Sustav e-Dnevnik</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version loaded. Reloading...');
                    window.location.reload();
                  }
                });
              }
            });
          }).catch(err => {
            console.log('SW registration failed: ', err);
          });
        });

        // Ensure pages do NOT reload constantly when service worker gains control/re-activates on focus
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('[SW] Controller changed. Skipping automatic reload to preserve application state.');
        });
      }

      // Detect dynamic import chunk failures and auto-reload to get new index.html with fresh hashes
      window.addEventListener('error', (e) => {
        if (e && e.message && (e.message.indexOf('Failed to fetch dynamically imported module') > -1 || e.message.indexOf('chunk') > -1)) {
          console.warn('[PWA] Dynamic import/chunk load failed. Force reloading client to fetch latest index...');
          window.location.reload();
        }
      }, true);
    </script>
  </body>
</html>
