name: Apply final thesis persistence server fix

on:
  push:
    branches:
      - fix-final-thesis-teacher-sync

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[final-thesis-server-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-final-thesis-teacher-sync
          fetch-depth: 0

      - name: Replace final thesis API with database-only persistence
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('server.ts')
          source = path.read_text(encoding='utf-8')

          start_marker = '  // Final Thesis Applications APIs'
          end_marker = '  // ==========================================\n  // Final Exam Defense Schedules & Commission Members APIs'
          start = source.find(start_marker)
          end = source.find(end_marker, start)

          if start < 0 or end < 0:
            raise SystemExit('Final thesis API block was not found in server.ts')

          replacement = r'''  // Final Thesis Applications APIs
  const FINAL_THESIS_DB_FIELDS = [
    'id', 'student_id', 'class_id', 'school_id', 'school_year_id',
    'thesis_title', 'mentor_name', 'mentor_id', 'exam_period', 'student_note',
    'status', 'submitted_at', 'created_at', 'updated_at',
    'creation_grade', 'defense_grade', 'final_grade',
    'creation_date', 'defense_date', 'defense_time', 'defense_classroom',
    'defense_committee', 'final_grade_date',
    'creation_graded_by', 'defense_graded_by', 'final_graded_by',
    'application_classification_number', 'application_registry_number',
    'application_data_entered_at', 'application_data_entered_by',
    'accepted_at', 'accepted_by',
    'rejected_at', 'rejected_by', 'rejection_note',
    'deregistration_note', 'deregistered_at',
    'deregistration_classification_number', 'deregistration_registry_number',
    'deregistration_data_entered_at', 'deregistration_data_entered_by'
  ];

  function sanitizeFinalThesisForDb(data: any) {
    const clean: any = {};
    for (const key of Object.keys(data || {})) {
      if (FINAL_THESIS_DB_FIELDS.includes(key) && data[key] !== undefined) {
        clean[key] = data[key];
      }
    }
    return clean;
  }

  async function resolveFinalThesisContext(studentId: string, suppliedClassId?: string | null) {
    if (!supabaseAdmin) {
      throw new Error('Supabase admin client is not configured.');
    }

    let classId = suppliedClassId && suppliedClassId !== 'N/A' ? suppliedClassId : null;

    if (!classId) {
      const { data: enrollmentRows, error: enrollmentError } = await supabaseAdmin
        .from('student_class_enrollments')
        .select('class_id')
        .eq('student_id', studentId)
        .eq('status', 'ACTIVE')
        .limit(1);

      if (enrollmentError) throw enrollmentError;
      classId = enrollmentRows?.[0]?.class_id || null;
    }

    if (!classId) {
      return { class_id: null, school_id: null, school_year_id: null };
    }

    const { data: classRow, error: classError } = await supabaseAdmin
      .from('classes')
      .select('school_id, school_year_id')
      .eq('id', classId)
      .maybeSingle();

    if (classError) throw classError;

    return {
      class_id: classId,
      school_id: classRow?.school_id || null,
      school_year_id: classRow?.school_year_id || null,
    };
  }

  app.get('/api/final-thesis', async (req, res) => {
    try {
      if (!supabaseAdmin) {
        return res.status(503).json({ error: 'Supabase admin client is not configured.' });
      }

      const { studentId, mentorId, classId, schoolId } = req.query;
      let query = supabaseAdmin.from('final_thesis').select('*');

      if (studentId) query = query.eq('student_id', String(studentId));
      if (mentorId) query = query.eq('mentor_id', String(mentorId));

      const { data, error } = await query;
      if (error) {
        console.error('FINAL THESIS GET ERROR:', error);
        return res.status(500).json({ error: error.message, code: error.code });
      }

      const normalized: any[] = [];

      for (const original of data || []) {
        let application = { ...original };

        if ((!application.class_id || !application.school_id) && application.student_id) {
          try {
            const context = await resolveFinalThesisContext(
              application.student_id,
              application.class_id
            );

            const repair: any = {};
            if (!application.class_id && context.class_id) repair.class_id = context.class_id;
            if (!application.school_id && context.school_id) repair.school_id = context.school_id;
            if (!application.school_year_id && context.school_year_id) {
              repair.school_year_id = context.school_year_id;
            }

            if (Object.keys(repair).length > 0) {
              const { error: repairError } = await supabaseAdmin
                .from('final_thesis')
                .update({ ...repair, updated_at: new Date().toISOString() })
                .eq('id', application.id);

              if (repairError) {
                console.error('FINAL THESIS LEGACY REPAIR ERROR:', repairError);
              } else {
                application = { ...application, ...repair };
              }
            }
          } catch (repairCrash: any) {
            console.error('FINAL THESIS LEGACY REPAIR CRASH:', repairCrash);
          }
        }

        if (classId && application.class_id !== String(classId)) continue;
        if (schoolId && application.school_id !== String(schoolId)) continue;
        normalized.push(application);
      }

      normalized.sort((a, b) => {
        const bTime = new Date(b.submitted_at || b.created_at || 0).getTime();
        const aTime = new Date(a.submitted_at || a.created_at || 0).getTime();
        return bTime - aTime;
      });

      return res.json(normalized);
    } catch (err: any) {
      console.error('FINAL THESIS GET CRASH:', err);
      return res.status(500).json({ error: err.message });
    }
  });

  app.post('/api/final-thesis', async (req, res) => {
    try {
      if (!supabaseAdmin) {
        return res.status(503).json({ error: 'Supabase admin client is not configured.' });
      }

      const incoming = { ...(req.body || {}) };
      const missing = ['student_id', 'thesis_title', 'mentor_id', 'exam_period']
        .filter((field) => !incoming[field]);

      if (missing.length > 0) {
        return res.status(400).json({
          error: `Nedostaju obavezni podaci: ${missing.join(', ')}`,
        });
      }

      const context = await resolveFinalThesisContext(
        incoming.student_id,
        incoming.class_id
      );

      if (!context.class_id || !context.school_id) {
        return res.status(400).json({
          error: 'Nije moguće odrediti aktivni razred i školu učenika.',
        });
      }

      const now = new Date().toISOString();
      const application = {
        ...incoming,
        ...context,
        id: incoming.id || crypto.randomUUID(),
        status: 'CREATED',
        submitted_at: now,
        created_at: incoming.created_at || now,
        updated_at: now,
      };

      const dbPayload = sanitizeFinalThesisForDb(application);
      const { data, error } = await supabaseAdmin
        .from('final_thesis')
        .insert(dbPayload)
        .select()
        .single();

      if (error) {
        console.error('FINAL THESIS POST ERROR:', error, dbPayload);
        return res.status(500).json({ error: error.message, code: error.code });
      }

      return res.status(201).json({
        success: true,
        data,
        db_persisted: true,
      });
    } catch (err: any) {
      console.error('FINAL THESIS POST CRASH:', err);
      return res.status(500).json({ error: err.message });
    }
  });

  app.put('/api/final-thesis/:id', async (req, res) => {
    try {
      if (!supabaseAdmin) {
        return res.status(503).json({ error: 'Supabase admin client is not configured.' });
      }

      const { id } = req.params;
      const updates = sanitizeFinalThesisForDb({
        ...(req.body || {}),
        updated_at: new Date().toISOString(),
      });

      const { data, error } = await supabaseAdmin
        .from('final_thesis')
        .update(updates)
        .eq('id', id)
        .select()
        .maybeSingle();

      if (error) {
        console.error('FINAL THESIS PUT ERROR:', error, updates);
        return res.status(500).json({ error: error.message, code: error.code });
      }

      if (!data) {
        return res.status(404).json({ error: 'Prijava završnog rada nije pronađena.' });
      }

      return res.json({ success: true, data, db_updated: true });
    } catch (err: any) {
      console.error('FINAL THESIS PUT CRASH:', err);
      return res.status(500).json({ error: err.message });
    }
  });

  app.delete('/api/final-thesis/:id', async (req, res) => {
    try {
      if (!supabaseAdmin) {
        return res.status(503).json({ error: 'Supabase admin client is not configured.' });
      }

      const { id } = req.params;
      const { data, error } = await supabaseAdmin
        .from('final_thesis')
        .delete()
        .eq('id', id)
        .select('id')
        .maybeSingle();

      if (error) {
        console.error('FINAL THESIS DELETE ERROR:', error);
        return res.status(500).json({ error: error.message, code: error.code });
      }

      if (!data) {
        return res.status(404).json({ error: 'Prijava završnog rada nije pronađena.' });
      }

      return res.json({ success: true, db_deleted: true });
    } catch (err: any) {
      console.error('FINAL THESIS DELETE CRASH:', err);
      return res.status(500).json({ error: err.message });
    }
  });

'''

          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Commit validated server fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-final-thesis-server-fix.yml
          git add server.ts
          git commit -m "fix: persist final thesis class context [final-thesis-server-fixed]"
          git push origin HEAD:fix-final-thesis-teacher-sync
