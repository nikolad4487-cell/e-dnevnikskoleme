name: Verify application
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.5
      - run: npm ci
      - run: npm test
      - name: Rehearse real PostgreSQL backup and restore with synthetic data
        run: node tests/backup-postgres-integration.mjs
      - run: npm run lint
      - run: npm run build
